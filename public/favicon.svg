<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#B8860B;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="ring-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:0" />
      <stop offset="100%" style="stop-color:#000;stop-opacity:0.4" />
    </radialGradient>
  </defs>
  
  <rect width="512" height="512" rx="128" fill="#000"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="220" stroke="url(#gold-grad)" stroke-width="4" stroke-opacity="0.2" />
  
  <!-- Stylized Imperial Cross -->
  <g transform="translate(256, 256)">
    <!-- Vertical Bar -->
    <rect x="-16" y="-180" width="32" height="360" rx="16" fill="url(#gold-grad)" />
    <!-- Horizontal Bar -->
    <rect x="-120" y="-80" width="240" height="32" rx="16" fill="url(#gold-grad)" />
    <!-- Lower Crossbeam -->
    <rect x="-80" y="40" width="160" height="24" rx="12" fill="url(#gold-grad)" />
    
    <!-- Center Jewel -->
    <circle cx="0" cy="-64" r="24" fill="#000" />
    <circle cx="0" cy="-64" r="16" fill="url(#gold-grad)" />
  </g>
  
  <!-- Shadow Overlay -->
  <rect width="512" height="512" rx="128" fill="url(#ring-grad)"/>
</svg>
